name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: State and native drawing tests
        run: ./scripts/test.sh
      - name: Build Apple Silicon and Intel app
        run: ./scripts/build.sh
      - name: Verify universal binary and signature
        run: |
          lipo -verify_arch arm64 x86_64 build/DuoBar.app/Contents/MacOS/DuoBar
          codesign --verify --deep --strict build/DuoBar.app
