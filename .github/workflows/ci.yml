name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  # Hosted runners may not ship the macOS 27 SDK yet; local builds still require 27.
  DUOBAR_MIN_SDK_MAJOR: "26"
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: State and native drawing tests
        run: ./scripts/test.sh
      - name: Build Apple Silicon and Intel app
        run: ./scripts/build.sh
      - name: Verify universal binary and signature
        run: |
          ./scripts/verify-app.sh build/MyDuoBar.app
